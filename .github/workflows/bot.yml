name: gamma-bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Сколько секунд держать бота (по умолчанию 21000 = 5 ч 50 мин)"
        required: false
        default: "21000"

concurrency:
  group: gamma-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, urllib.request, json
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=20) as r:
              data = json.load(r)
          print("token ok:", data.get("ok"), "bot:", data.get("result", {}).get("username"))
          PY

      - name: Smoke check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_DB_TOKEN: ${{ secrets.TURSO_DB_TOKEN }}
        run: |
          python - <<'PY'
          import bot
          names = {h.callback.__name__ for h in bot.dp.message.handlers}
          need = {"cmd_start", "on_text", "on_photo", "on_document", "cmd_help", "cmd_adm", "cmd_aboutme", "cmd_forget"}
          missing = need - names
          assert not missing, f"нет обработчиков: {sorted(missing)}"
          assert len(bot.dp.business_message.handlers) == 1, "нет бизнес-обработчика"
          print("smoke ok:", bot.BOT_VERSION, sorted(names))
          PY

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DB_KEY: ${{ secrets.DB_KEY }}
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_DB_TOKEN: ${{ secrets.TURSO_DB_TOKEN }}
          OWNER_CODE: ${{ secrets.OWNER_CODE }}
          MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite
          HISTORY_TURNS: "8"
          COOLDOWN_SECONDS: "5"
          MAX_IMAGE_MB: "10"
          DB_SYNC_SECONDS: "30"
        run: |
          timeout --signal=INT "${{ github.event.inputs.seconds || 21000 }}" python -u bot.py || true

      - name: Save database snapshot
        if: always()
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
        run: |
          git config user.name "gamma-bot"
          git config user.email "bot@users.noreply.github.com"
          python - <<'PY'
          import sync
          if not sync.push():
              print("снимок не отправлен")
          PY
