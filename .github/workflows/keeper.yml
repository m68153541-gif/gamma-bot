name: gamma-bot keeper

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: gamma-bot-keeper
  cancel-in-progress: false

jobs:
  revive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart the bot if it is not running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow=bot.yml --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending")] | length')
          echo "bot runs active: $active"
          if [ "$active" = "0" ]; then
            gh workflow run bot.yml --ref master
            echo "bot заспался — запуск отправлен"
            sleep 5
            gh run list --workflow=bot.yml --limit 1 --json status,createdAt
          else
            echo "бот уже работает, ничего не делаю"
          fi
